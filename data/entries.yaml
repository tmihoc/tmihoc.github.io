    scope ambiguity (e.g. <em>two horses didn't jump</em>) by deriving questions under discussion
    from grammatical structure and adding a silent exhaustification operator, reproducing
    experimental endorsement asymmetries without stipulating ad hoc priors, implemented in
    WebPPL, a purely functional probabilistic subset of JavaScript.
