- id: insight-see-link-taxonomy
  sentence: 'I designed a small taxonomy of typed "See" links to reconnect content inside
    a documentation monolith without duplicating it: See also, linking an entity-lifecycle
    how-to laterally to its reference; See more, linking a procedure to the tool reference
    it depends on. After federation, I extended it with See first and See next, linking a
    use-an-artifact story to the story of building that artifact.'
